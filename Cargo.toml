[package]
name = "msi-xpander"
version = "0.1.0"
edition = "2021"
description = "Driver for the MSI Xpander USB companion display: HID handshake, JPEG 4:2:0 streaming, macOS desktop bridge, PNG kiosk"
license = "Apache-2.0"
repository = "https://github.com/zenhsieh/msi-xpander-rust"
readme = "README.md"

[features]
default = []
hardware = ["dep:hidapi", "dep:rusb", "dep:image", "dep:jpeg-encoder"]

[dependencies]
anyhow = "1"
rand = "0.8"
rsa = "0.9.8"
serde_json = "1"
hidapi = { version = "2.6.7", optional = true }
rusb = { version = "0.9.4", features = ["vendored"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

jpeg-encoder = { version = "0.7.1", optional = true }
